appId: com.vhplayer.app
productName: VHplayer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# ffmpeg-static 为二进制，必须解包出 asar 才能被 child_process spawn
asarUnpack:
  - node_modules/ffmpeg-static/**
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VHplayer
  artifactName: VHplayer-Setup-${version}.exe
electronDownload:
  cache: .electron-cache
  # 国内网络访问 github 不稳定，electron 发行包走 npmmirror 镜像
  mirror: https://npmmirror.com/mirrors/electron/
